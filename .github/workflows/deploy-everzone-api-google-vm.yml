# Generated by Sawyun project IDE for the deploy target "everzone-api (Google VM)".
# You can edit it; Sawyun project IDE only relies on the file name and the image_tag input.
name: Deploy everzone-api (Google VM)

on:
  push:
    branches: [backend]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA) to deploy. Leave empty to build and deploy this commit."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-everzone-api-google-vm
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/khant26/everzone-api

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.CICD_EVERZONE_API_GOOGLE_VM_HOST }}
          port: ${{ secrets.CICD_EVERZONE_API_GOOGLE_VM_PORT }}
          username: ${{ secrets.CICD_EVERZONE_API_GOOGLE_VM_USER }}
          key: ${{ secrets.CICD_EVERZONE_API_GOOGLE_VM_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /srv/everzone
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose pull api
            docker compose up -d api
            docker logout ghcr.io
            echo "Deployed ghcr.io/khant26/everzone-api:$IMAGE_TAG"
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "https://api-everzone.khantmaung.com/health" > /dev/null; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "https://api-everzone.khantmaung.com/health did not answer"; exit 1
